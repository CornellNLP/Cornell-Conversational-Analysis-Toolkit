# Requires Python 3.12+ (newer than core ConvoKit, which supports 3.10+). Use a Python 3.12+
# environment before installing.
# Install for local development (from the repository root), together with ConvoKit, whose data
# model includes the AI fields (AI speakers, private assistants, supports):
#   python -m pip install -e . -e ./convokit/convokitai-simulation
# Install from GitHub:
#   pip install "git+https://github.com/CornellNLP/ConvoKit.git@master#subdirectory=convokit/convokitai-simulation"
[project]
name = "dl-sim"
version = "0.1.0"
description = "Run AI agent conversation simulations on a ConvoArena backend and load them as ConvoKit corpora"
requires-python = ">=3.12"  # stricter than convokit itself (>=3.10)
dependencies = [
    # ConvoKit 5.0.0 is the first release whose data model includes the AI fields
    "convokit>=5.0.0",
    "pydantic>=2.0",
    "python-dotenv",
    "requests",
    "pandas",
    "udocker",
    "pyyaml",
    "tqdm",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["deliberate_lab"]
py-modules = ["local_backend", "dl_container", "simulation", "create_simulation", "export_to_corpus"]
